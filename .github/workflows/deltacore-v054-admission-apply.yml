name: Apply DeltaCore v0.5.4 admission control
on:
  push:
    branches:
      - codex/deltacore-motion-baseline-v0.1
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0.5.4-admission-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deltacore-motion-baseline-v0.1
          fetch-depth: 0
      - run: python3 tools/apply_v054_admission.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeltaCore
          git commit -m "DeltaCore v0.5.4: credit admission control [v0.5.4-admission-applied]"
          git push origin HEAD:codex/deltacore-motion-baseline-v0.1
