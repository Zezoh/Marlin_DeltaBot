name: Apply HIL harness isolation fix
on:
  push:
    branches:
      - codex/deltacore-motion-baseline-v0.1
    paths:
      - tools/apply_hil_harness_isolation_fix.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deltacore-motion-baseline-v0.1
          fetch-depth: 0
      - run: python3 tools/apply_hil_harness_isolation_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeltaCore/test/simavr_ramps14_hil.c
          git commit -m "test: isolate RAMPS HIL scenarios and parse complete PERF lines"
          git push origin HEAD:codex/deltacore-motion-baseline-v0.1
