name: DeltaCore v0.4.5 Hotfix

on:
  push:
    branches:
      - codex/deltacore-motion-baseline-v0.1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0.4.5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deltacore-motion-baseline-v0.1
          fetch-depth: 0

      - name: Apply scheduler hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('DeltaCore/src/StepperEngine.cpp')
          s = p.read_text()
          old = '''bool StepperEngine::loadNextMotionBlock() {
            if (!prefetch_valid_) return false;
            MotorBlock *old_active = active_block_;
          '''
          new = '''bool StepperEngine::loadNextMotionBlock() {
            // Normal path: the main loop publishes the next compact MotorBlock.
            // Hard real-time fallback: if main-loop prefetch misses its deadline but
            // the ring still contains blocks, consume one here instead of stopping
            // Timer1. This is intentionally a fallback, not the common path.
            if (!prefetch_valid_) {
              if (!queue_ || !queue_->popFromISR(*prefetch_block_)) return false;
              prefetch_valid_ = true;
            }
            MotorBlock *old_active = active_block_;
          '''
          if old not in s:
              raise SystemExit('StepperEngine hotfix anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('DeltaCore/src/main.cpp')
          s = p.read_text()
          old = '''void loop() {
            serviceSerial();
            motion.service();
            // Idempotent prefetch/recovery service: fills the next block outside Timer1 ISR
            // and restarts Timer1 only if an exceptional queue drain stopped motion.
            stepper.kickMotion();
          '''
          new = '''void loop() {
            serviceSerial();
            // Service the published next block before any potentially compute-heavy
            // trajectory generation, then again afterwards. This gives the ISR a
            // prepared handoff while the main loop computes future Delta segments.
            stepper.kickMotion();
            motion.service();
            stepper.kickMotion();
          '''
          if old not in s:
              raise SystemExit('main loop hotfix anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('0.4.4', '0.4.5')
          s = s.replace('BLOCK_PREFETCH DEBUG:', 'BLOCK_PREFETCH+ISR_FALLBACK DEBUG:')
          p.write_text(s)

          p = Path('DeltaCore/test/test_math.cpp')
          s = p.read_text().replace('v0.4.4', 'v0.4.5')
          p.write_text(s)

          p = Path('.github/workflows/deltacore-build.yml')
          s = p.read_text().replace('DeltaCore-Mega2560-v0.4.4', 'DeltaCore-Mega2560-v0.4.5')
          p.write_text(s)
          PY

      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/deltacore-v045-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeltaCore .github/workflows/deltacore-build.yml .github/workflows/deltacore-v045-hotfix.yml
          git commit -m "DeltaCore v0.4.5: deadline-safe block handoff [v0.4.5-applied]"
          git push origin HEAD:codex/deltacore-motion-baseline-v0.1
