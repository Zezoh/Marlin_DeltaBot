name: DeltaCore v0.4.7 Velocity Continuity
on:
  push:
    branches: [codex/deltacore-motion-baseline-v0.1]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0.4.7-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deltacore-motion-baseline-v0.1
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # MotionController.h: carry the actual tail interval across generated blocks.
          p=Path('DeltaCore/src/MotionController.h')
          s=p.read_text()
          old='''  float acceleration_mm_s2_;\n  float default_feed_mm_s_;\n  int8_t smoothing_mode_;\n'''
          new='''  float acceleration_mm_s2_;\n  float default_feed_mm_s_;\n  int8_t smoothing_mode_;\n  bool interval_continuity_valid_;\n  int32_t generated_interval_tail_q8_;\n'''
          if old not in s: raise SystemExit('header anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('DeltaCore/src/MotionController.cpp')
          s=p.read_text()
          old='''    profile_(), acceleration_mm_s2_(cfg::DEFAULT_ACCEL_MM_S2), default_feed_mm_s_(cfg::DEFAULT_FEED_MM_S),\n    smoothing_mode_(-1) {}\n'''
          new='''    profile_(), acceleration_mm_s2_(cfg::DEFAULT_ACCEL_MM_S2), default_feed_mm_s_(cfg::DEFAULT_FEED_MM_S),\n    smoothing_mode_(-1), interval_continuity_valid_(false), generated_interval_tail_q8_(0) {}\n'''
          if old not in s: raise SystemExit('ctor anchor not found')
          s=s.replace(old,new,1)

          old='''  smoothing_mode_ = -1;\n  planner_.clear();\n'''
          new='''  smoothing_mode_ = -1;\n  interval_continuity_valid_ = false;\n  generated_interval_tail_q8_ = 0;\n  planner_.clear();\n'''
          if old not in s: raise SystemExit('begin anchor not found')
          s=s.replace(old,new,1)

          # Replace independent per-block interval start/end calculation with a
          # carried boundary interval and solve the in-block linear ramp from total time.
          old='''  if (block.virtual_events == 1U) {\n    block.interval_start_ticks = clampTimerTicks(uint32_t(total_ticks_f + 0.5f));\n    block.interval_delta_q8 = 0;\n  }\n  else {\n    const float event_density = float(block.virtual_events) / actual_ds;\n    float rate_start = event_density * js0.speed_mm_s;\n    float rate_end = event_density * js1.speed_mm_s;\n    if (rate_start < 1.0f) rate_start = 1.0f;\n    if (rate_end < 1.0f) rate_end = 1.0f;\n    float raw_start = float(cfg::TIMER_HZ) / rate_start;\n    float raw_end = float(cfg::TIMER_HZ) / rate_end;\n    const float raw_total = float(block.virtual_events) * 0.5f * (raw_start + raw_end);\n    const float scale = raw_total > 0.0f ? total_ticks_f / raw_total : 1.0f;\n    raw_start *= scale;\n    raw_end *= scale;\n\n    block.interval_start_ticks = clampTimerTicks(uint32_t(raw_start + 0.5f));\n    const uint16_t interval_end = clampTimerTicks(uint32_t(raw_end + 0.5f));\n    const int32_t diff = int32_t(interval_end) - int32_t(block.interval_start_ticks);\n    block.interval_delta_q8 = (diff * 256L) / int32_t(block.virtual_events - 1U);\n  }\n'''
          new='''  // Velocity-continuous event clock. Previous versions independently\n  // re-derived interval_start for every Delta segment. Because virtual_events\n  // changes with tower geometry and ceil(), adjacent blocks could have a\n  // discontinuous step-event rate even while actuator phase stayed exact.\n  // Carry the actual tail interval into the next block, then solve the linear\n  // interval ramp so the arithmetic-series sum still equals this block's dt.\n  uint16_t independent_start_ticks = 0;\n  if (block.virtual_events == 1U) {\n    independent_start_ticks = clampTimerTicks(uint32_t(total_ticks_f + 0.5f));\n  }\n  else {\n    const float event_density = float(block.virtual_events) / actual_ds;\n    float rate_start = event_density * js0.speed_mm_s;\n    float rate_end = event_density * js1.speed_mm_s;\n    if (rate_start < 1.0f) rate_start = 1.0f;\n    if (rate_end < 1.0f) rate_end = 1.0f;\n    float raw_start = float(cfg::TIMER_HZ) / rate_start;\n    float raw_end = float(cfg::TIMER_HZ) / rate_end;\n    const float raw_total = float(block.virtual_events) * 0.5f * (raw_start + raw_end);\n    const float scale = raw_total > 0.0f ? total_ticks_f / raw_total : 1.0f;\n    raw_start *= scale;\n    independent_start_ticks = clampTimerTicks(uint32_t(raw_start + 0.5f));\n  }\n\n  if (block.virtual_events == 1U) {\n    block.interval_start_ticks = independent_start_ticks;\n    block.interval_delta_q8 = 0;\n    generated_interval_tail_q8_ = int32_t(block.interval_start_ticks) << 8;\n    interval_continuity_valid_ = true;\n  }\n  else {\n    const int64_t total_q8 = int64_t(total_ticks_f * 256.0f + 0.5f);\n    const int32_t min_q8 = int32_t(cfg::MIN_EVENT_INTERVAL_TICKS) << 8;\n    const int32_t max_q8 = int32_t(cfg::MAX_EVENT_INTERVAL_TICKS) << 8;\n\n    int32_t start_q8 = interval_continuity_valid_\n      ? generated_interval_tail_q8_\n      : (int32_t(independent_start_ticks) << 8);\n    if (start_q8 < min_q8) start_q8 = min_q8;\n    if (start_q8 > max_q8) start_q8 = max_q8;\n\n    // Exact-time feasibility for a linear interval ramp: E = 2*avg - S.\n    // Clamp S only if the carried value would force E outside timer limits.\n    const int64_t twice_avg_q8 = (2LL * total_q8) / int64_t(block.virtual_events);\n    int64_t feasible_lo = twice_avg_q8 - int64_t(max_q8);\n    int64_t feasible_hi = twice_avg_q8 - int64_t(min_q8);\n    if (feasible_lo < min_q8) feasible_lo = min_q8;\n    if (feasible_hi > max_q8) feasible_hi = max_q8;\n    if (feasible_lo <= feasible_hi) {\n      if (start_q8 < feasible_lo) start_q8 = int32_t(feasible_lo);\n      if (start_q8 > feasible_hi) start_q8 = int32_t(feasible_hi);\n    }\n\n    block.interval_start_ticks = clampTimerTicks(uint32_t((start_q8 + 128) >> 8));\n    const int64_t stored_start_q8 = int64_t(block.interval_start_ticks) << 8;\n    const int64_t n = int64_t(block.virtual_events);\n    const int64_t denom = n * (n - 1LL);\n    const int64_t numer = 2LL * (total_q8 - n * stored_start_q8);\n    int64_t delta_q8 = denom ? (numer / denom) : 0;\n    if (delta_q8 > 2147483647LL) delta_q8 = 2147483647LL;\n    if (delta_q8 < -2147483647LL) delta_q8 = -2147483647LL;\n    block.interval_delta_q8 = int32_t(delta_q8);\n\n    int64_t tail_q8 = stored_start_q8 + delta_q8 * (n - 1LL);\n    if (tail_q8 < min_q8) tail_q8 = min_q8;\n    if (tail_q8 > max_q8) tail_q8 = max_q8;\n    generated_interval_tail_q8_ = int32_t(tail_q8);\n    interval_continuity_valid_ = true;\n  }\n'''
          if old not in s: raise SystemExit('timing anchor not found')
          s=s.replace(old,new,1)

          old='''  motion_started_ = false;\n  generation_complete_ = false;\n  phase_anchor_pending_ = true;\n'''
          new='''  motion_started_ = false;\n  generation_complete_ = false;\n  phase_anchor_pending_ = true;\n  interval_continuity_valid_ = false;\n  generated_interval_tail_q8_ = 0;\n'''
          if old not in s: raise SystemExit('startBatch anchor not found')
          s=s.replace(old,new,1)

          # Revert v0.4.6 boundary-first scheduling to the v0.4.5 handoff.
          old='''  if (!phase_.active()) {\n    block_active_ = false;\n\n    // Boundary-first scheduling: reserve the next compare deadline before\n    // phase/block handoff work. Previously we loaded and validated the next\n    // block first, so short intervals were already late and the guard stretched\n    // the trajectory. The published prefetch normally provides this deadline;\n    // the ring fallback remains available inside loadNextMotionBlock().\n    uint16_t boundary_ticks = 0;\n    if (prefetch_valid_) boundary_ticks = prefetch_block_->interval_start_ticks;\n    else if (queue_ && !queue_->empty()) {\n      servicePrefetch();\n      if (prefetch_valid_) boundary_ticks = prefetch_block_->interval_start_ticks;\n    }\n    if (boundary_ticks) scheduleMotionInterval(boundary_ticks);\n\n    if (loadNextMotionBlock()) {\n      if (active_pulse_axes_) {\n        pending_direction_bits_ = currentBlock().direction_bits;\n        direction_pending_ = true;\n      }\n      else {\n        applyDirectionBits(currentBlock().direction_bits);\n        direction_pending_ = false;\n      }\n      // Do not reschedule here: the deadline was already reserved above.\n      // If no published deadline was available, fall back to the loaded block.\n      if (!boundary_ticks) scheduleMotionInterval(currentMotionInterval());\n    }\n'''
          new='''  if (!phase_.active()) {\n    block_active_ = false;\n    if (loadNextMotionBlock()) {\n      if (active_pulse_axes_) {\n        pending_direction_bits_ = currentBlock().direction_bits;\n        direction_pending_ = true;\n      }\n      else {\n        applyDirectionBits(currentBlock().direction_bits);\n        direction_pending_ = false;\n      }\n      scheduleMotionInterval(currentMotionInterval());\n    }\n'''
          sp=Path('DeltaCore/src/StepperEngine.cpp')
          ss=sp.read_text()
          if old not in ss: raise SystemExit('boundary revert anchor not found')
          sp.write_text(ss.replace(old,new,1))

          # Service prefetch/recovery after every generated segment once motion is live.
          old='''  else {\n    while (!generation_complete_ && queue_.freeSlots() > 1U) {\n      if (!generateOneSegment()) break;\n    }\n    stepper_.kickMotion();\n  }\n'''
          new='''  else {\n    while (!generation_complete_ && queue_.freeSlots() > 1U) {\n      if (!generateOneSegment()) break;\n      stepper_.kickMotion();\n    }\n    stepper_.kickMotion();\n  }\n'''
          if old not in s: raise SystemExit('service anchor not found')
          s=s.replace(old,new,1)

          s=s.replace('0.4.6','0.4.7')
          s=s.replace('BLOCK_PREFETCH+ISR_FALLBACK+BOUNDARY_FIRST DEBUG:','BLOCK_PREFETCH+ISR_FALLBACK+VELOCITY_CONTINUOUS DEBUG:')
          p.write_text(s)

          tp=Path('DeltaCore/test/test_math.cpp')
          tp.write_text(tp.read_text().replace('v0.4.6','v0.4.7'))
          PY
      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeltaCore
          git commit -m "DeltaCore v0.4.7: continuous event velocity across blocks [v0.4.7-applied]"
          git push origin HEAD:codex/deltacore-motion-baseline-v0.1
