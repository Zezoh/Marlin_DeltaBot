name: DeltaCore v0.4.7 Version Fix
on:
  push:
    branches: [codex/deltacore-motion-baseline-v0.1]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0.4.7-version-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deltacore-motion-baseline-v0.1
          fetch-depth: 0
      - name: Fix firmware identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DeltaCore/src/main.cpp')
          s=p.read_text()
          if 'DeltaCore 0.4.6' not in s or 'BOUNDARY_FIRST' not in s:
              raise SystemExit('expected v0.4.6 identity anchors not found')
          s=s.replace('0.4.6','0.4.7')
          s=s.replace('BOUNDARY_FIRST','VELOCITY_CONTINUOUS')
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeltaCore/src/main.cpp
          git commit -m "DeltaCore v0.4.7: fix firmware identity strings [v0.4.7-version-fixed]"
          git push origin HEAD:codex/deltacore-motion-baseline-v0.1
