name: DeltaCore v0.5.0 Deterministic DDA Rewrite
on:
  push:
    branches: [codex/deltacore-motion-baseline-v0.1]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0.5.0-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deltacore-motion-baseline-v0.1
          fetch-depth: 0
      - name: Rewrite motion engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Compact integer MotorBlock: exact physical step counts + exact segment tick budget.
          p=Path('DeltaCore/src/MotionQueue.h'); s=p.read_text()
          s=re.sub(r'enum MotorBlockFlags.*?class MotionQueue', '''struct MotorBlock {\n  uint16_t steps[3];\n  uint16_t event_count;\n  uint16_t interval_base_ticks;\n  uint16_t interval_remainder_ticks;\n  uint8_t direction_bits;\n};\n\nclass MotionQueue''', s, flags=re.S)
          p.write_text(s)

          # New deterministic AVR stepper interface. Keep legacy diagnostic fields at zero
          # so the serial/debug layer stays wire-compatible while we validate hardware.
          Path('DeltaCore/src/StepperEngine.h').write_text(r'''#pragma once
