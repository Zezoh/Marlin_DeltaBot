  bool startHomeSeek(bool slow); bool startHomeBackoff(); HomeResult homeResult() const { return HomeResult(home_result_); }
  void clearHomeResult(); bool endstopTriggered(uint8_t axis) const; uint8_t endstopMask() const;
  void emergencyStop(FaultCode code=FAULT_ESTOP); bool clearFault(); FaultCode fault() const { return FaultCode(fault_); }
  void setMotorPositionSteps(const int32_t steps[3]); void getMotorPositionSteps(int32_t steps[3]) const;
  uint32_t completedStepEvents() const { return completed_step_events_; }
  void snapshotStats(StepperStats &stats) const; void clearStats(); void onCompareA(); void onCompareB();
  static StepperEngine *instance() { return instance_; }
private:
  enum Mode:uint8_t { MODE_IDLE=0, MODE_MOTION, MODE_HOME };
