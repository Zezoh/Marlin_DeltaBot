  uint16_t dda_accum_[3], event_index_, timing_accum_;
  volatile HomeKind home_kind_; volatile int8_t home_result_; volatile uint8_t home_active_axes_;
  volatile uint32_t home_events_done_, home_event_limit_; volatile uint16_t home_interval_ticks_;
  static StepperEngine *instance_;
