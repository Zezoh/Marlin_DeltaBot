name: Apply DeltaCore stepper ownership fix
on:
  push:
    branches:
      - codex/deltacore-motion-baseline-v0.1
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stepper-owner-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deltacore-motion-baseline-v0.1
          fetch-depth: 0
      - run: python3 tools/apply_stepper_ownership_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeltaCore/src/main.cpp DeltaCore/test/simavr_ramps14_hil.c
          git commit -m "DeltaCore: enforce controller-owned Timer1 start [stepper-owner-applied]"
          git push origin HEAD:codex/deltacore-motion-baseline-v0.1
